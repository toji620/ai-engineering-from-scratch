# Course compose file adapted for a Mac: the NVIDIA deploy block is removed
# (no NVIDIA GPU), and the ai-dev service uses the flask image built from
# the Dockerfile in this folder.
services:
  ai-dev:
    image: ai-dev-flask
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/workspace
      - ~/models:/models
    ports:
      - "8888:8888"
    stdin_open: true
    tty: true
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
